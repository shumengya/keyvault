<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4caf50" />
  <title>离线 - 萌芽密码管理器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkaimono-regular.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkaimono-bold.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'LXGW WenKai Mono', ui-monospace, monospace;
      background: linear-gradient(135deg, #f0fdf0 0%, #e8f5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 8px 32px rgba(76,175,80,0.15);
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 22px; color: #1b5e20; margin-bottom: 12px; font-weight: 700; }
    p { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    button {
      font-family: inherit;
      background: linear-gradient(135deg, #66bb6a, #4caf50);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(76,175,80,0.4); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌱</div>
    <h1>当前处于离线状态</h1>
    <p>无法连接到网络，请检查您的网络连接后重试。<br>已缓存的数据仍可查看。</p>
    <button onclick="window.location.reload()">重新连接</button>
  </div>
</body>
</html>
